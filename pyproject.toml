[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-cloud"
version = "0.1.0"
description = "A-share-first quantitative research, backtesting and local paper simulation workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.scripts]
quant-research = "quant_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
